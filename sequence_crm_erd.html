
<style>
#erd { padding: 1rem 0; }
#erd svg { width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a28' : '#f1efe8',
    primaryBorderColor: dark ? '#5f5e5a' : '#b4b2a9',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
    attributeBackgroundColorEven: dark ? '#232321' : '#ffffff',
    attributeBackgroundColorOdd: dark ? '#2c2c2a' : '#f9f8f4',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USER {
    int id PK
    string email
    string hashed_password
    bool is_active
    datetime created_at
  }
  ROLE {
    int id PK
    string name
  }
  PERMISSION {
    int id PK
    string name
  }
  CUSTOMER {
    int id PK
    string name
    string email
    string phone
    string company
    string status
    int owner_id FK
    datetime created_at
    datetime updated_at
  }
  INTERACTION {
    int id PK
    int customer_id FK
    int created_by FK
    string type
    string title
    text notes
    datetime occurred_at
    datetime created_at
    datetime updated_at
  }
  AI_INSIGHT {
    int id PK
    int interaction_id FK
    text summary
    string sentiment
    json action_items
    json risks
    string status
    text error_message
    datetime created_at
    datetime updated_at
  }
  USER_ROLES {
    int user_id FK
    int role_id FK
  }
  ROLE_PERMISSIONS {
    int role_id FK
    int permission_id FK
  }

  USER ||--o{ CUSTOMER : "owns"
  USER ||--o{ INTERACTION : "creates"
  USER ||--o{ USER_ROLES : "assigned"
  ROLE ||--o{ USER_ROLES : "via"
  ROLE ||--o{ ROLE_PERMISSIONS : "grants"
  PERMISSION ||--o{ ROLE_PERMISSIONS : "via"
  CUSTOMER ||--o{ INTERACTION : "has"
  INTERACTION ||--o| AI_INSIGHT : "generates"
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
